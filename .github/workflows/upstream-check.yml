name: Zed extension upstream check

on:
  schedule:
    # Every Monday at 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "packages/zed-extension/**"
      - "packages/tree-sitter-solidmx/**"

permissions:
  contents: read

jobs:
  solidmx-vendor-matches:
    # packages/tree-sitter-solidmx vendors tree-sitter-typescript at a pinned
    # sha and reapplies patches/*.patch on top. `vendor.sh --check` re-fetches
    # the pin into a temp dir, reapplies the patches, and diffs against
    # vendor/ — so a hand-edit to vendor/ that was never captured as a patch
    # (exactly the edit the next re-vendor would silently revert) fails here.
    #
    # Same standard as `vendored-files-match` below: the drift check is only
    # worth defining if something actually runs it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tree-sitter-solidmx
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: vendor.sh --check
        run: ./scripts/vendor.sh --check

  solidmx-generated-output-matches:
    # The generated parser is committed because Zed compiles it directly and
    # never runs `tree-sitter generate` (UPSTREAM.md). That only holds if the
    # committed output actually corresponds to grammar.js + the vendored tree,
    # so regenerate and diff. Catches a hand-edited src/grammar.json, and a
    # grammar.js change committed without regenerating.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tree-sitter-solidmx
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: ./scripts/vendor.sh
      - run: bunx tree-sitter generate
      - run: |
          if ! git diff --exit-code -- src; then
            echo "src/ doesn't match what 'tree-sitter generate' produces from grammar.js + vendor/." >&2
            echo "Run 'bun run generate' in packages/tree-sitter-solidmx and commit the result." >&2
            exit 1
          fi

  vendored-files-match:
    # Regenerates languages/mx/*.scm from the pinned revs (no live upstream
    # HEAD lookup — just what vendor.sh's normal mode already does) and
    # diffs against what's committed. Catches a hand-edit of those files,
    # which UPSTREAM.md says never to do, without depending on network
    # drift state (that's the separate `check` job below, cron/dispatch only).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zed-extension
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/vendor.sh
      - run: |
          if ! git diff --exit-code -- languages/mx; then
            echo "languages/mx/*.scm doesn't match what vendor.sh generates from the pinned revs." >&2
            echo "Never hand-edit those files — edit overlay/mx/*.scm or add a patches/*.patch and rerun vendor.sh." >&2
            exit 1
          fi

  check:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zed-extension
    steps:
      - uses: actions/checkout@v4

      - name: Check for upstream drift
        id: check
        run: |
          set +e
          ./scripts/vendor.sh --check
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [[ "$rc" -eq 1 ]]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "vendor.sh --check failed (exit $rc) — not a drift result, see logs above." >&2
            exit 1
          fi

      - name: Update pins to upstream HEAD
        if: steps.check.outputs.drift == 'true'
        run: ./scripts/vendor.sh --update-pins

      - name: Regenerate vendored queries
        if: steps.check.outputs.drift == 'true'
        run: ./scripts/vendor.sh

      - name: Open PR on drift
        if: steps.check.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(zed-extension): vendor upstream MX query/grammar drift"
          title: "chore(zed-extension): upstream drift detected"
          body: |
            `scripts/vendor.sh --check` found the pinned `marko-js/tree-sitter` and/or
            `marko-js/zed` revs are behind their upstream HEAD. `scripts/vendor.sh
            --update-pins` bumped `TS_REV`/`ZED_REV` to current upstream HEAD and
            `scripts/vendor.sh` regenerated `languages/mx/*.scm` from the new pins —
            review the diff before merging. If the grammar rev moved, also bump
            `extension.toml`'s `[grammars.marko]` rev to match `TS_REV` before merging.

            See `packages/zed-extension/UPSTREAM.md` "Bump procedure".
          branch: chore/zed-extension-upstream-bump
          add-paths: |
            packages/zed-extension/scripts/vendor.sh
            packages/zed-extension/languages/mx/*.scm
