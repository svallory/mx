name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # bun run verify (typecheck, lint, build, test) does NOT reach
      # packages/tree-sitter-solidmx's own `bun run test` — root `test` is a
      # bare `vitest run` over vitest's `projects: ["packages/*"]`, and that
      # package has no vitest project (it's a C/JS tree-sitter grammar,
      # tested with bash scripts, not vitest). Confirmed by reading both
      # configs, not assumed: a package glob resolving to a directory with no
      # vitest project is silently skipped, not an error. So it gets its own
      # step below rather than being (wrongly) assumed covered by `verify`.
      - run: bun run verify

      - name: tree-sitter-solidmx grammar checks (not reached by bun run verify)
        working-directory: packages/tree-sitter-solidmx
        run: bun run test

      - run: bun run oracle -- --strict
      - run: bun run oracle:marko -- --strict

  zed-compile-check:
    # Reproduces Zed's own grammar compile step against a clean clone of
    # HEAD (see packages/tree-sitter-solidmx/scripts/zed-compile-check.sh).
    # This is its own job, not folded into `verify` above, so a missing wasm
    # toolchain here can never be masked by `bun run test`'s own success —
    # see the ZED_COMPILE_CHECK_FORCE_FALLBACK note below for why runners
    # need the fallback path forced rather than relying on Zed's wasi-sdk
    # simply not being found.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      # GitHub's ubuntu-latest runners ship Docker (not Podman — this
      # diverges from the operator's local machine, where `tree-sitter build
      # --wasm`'s emscripten-via-docker fallback failed for lack of a running
      # Podman machine). `--docker` is `tree-sitter build --wasm`'s own flag
      # to run emscripten in a container rather than requiring a local
      # emsdk install.
      #
      # ZED_COMPILE_CHECK_FORCE_FALLBACK=1 skips the wasi-sdk clang lookup
      # unconditionally — runners never have Zed installed, so without this
      # the script would take the fallback path anyway by omission, which is
      # indistinguishable from "nobody checked whether the fallback path
      # itself works". Forcing it makes CI exercise the exact branch every
      # contributor without a local Zed install is also on.
      #
      # If this step ever reports the wasm toolchain missing rather than a
      # real compile failure, that is a loud, honest failure to fix — never
      # patch it to skip green. See UPSTREAM.md and the task report for why:
      # a gate that goes silently green when its toolchain is missing is
      # exactly the defect class this whole check exists to catch.
      - name: "zed-compile-check.sh (forced fallback: tree-sitter build --wasm --docker)"
        working-directory: packages/tree-sitter-solidmx
        env:
          ZED_COMPILE_CHECK_FORCE_FALLBACK: "1"
          ZED_COMPILE_CHECK_WASM_BUILD_ARGS: "--docker"
        run: ./scripts/zed-compile-check.sh
