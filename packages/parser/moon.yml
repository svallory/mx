# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "tsc"
    args: ["--noEmit"]
    inputs:
      - "src/**/*"
      - "tsconfig.json"

  test:
    command: "vitest"
    args: ["run", "--root", "../..", "--project", "@mxlang/parser"]
    inputs:
      - "src/**/*"
      - "/vitest.config.ts"

  build:
    command: "bun"
    args:
      [
        "build",
        "src/index.ts",
        "--outdir",
        "dist",
        "--target",
        "node",
        "--format",
        "esm",
        "--define",
        "process.env.BABEL_8_BREAKING=false",
        "--define",
        "process.env.USE_ESM=true",
        "--define",
        "process.env.IS_PUBLISH=true",
      ]
    inputs:
      - "src/**/*"
    outputs:
      - "dist"
