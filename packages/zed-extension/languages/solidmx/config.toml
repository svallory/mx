name = "SolidMX"
grammar = "solidmx"
path_suffixes = ["solid.mx"]

# TypeScript host language: line comments, no HTML comments (unlike MX,
# SolidMX has no markup-mode host — everything outside an `mx_element`
# region is plain TypeScript).
line_comments = ["// "]
block_comment = ["/* ", " */"]

tab_size = 2
hard_tabs = false

autoclose_before = ";:.,=}])>` \t\n"

brackets = [
  { start = "<", end = ">", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
