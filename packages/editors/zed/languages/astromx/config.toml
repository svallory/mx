name = "AstroMX"
grammar = "marko"
path_suffixes = ["amx"]

# AstroMX (`.amx`, decisions 76c/78): an Astro component whose *template* is
# MX. The file is a `---` TypeScript fence followed by an MX template, and the
# template half is the whole of what a grammar has to get right — so this
# language rides Marko's own grammar, the same one `MX` uses, rather than
# `tree-sitter-astro`.
#
# Why not the official Astro grammar: `zeds/astro` pins
# `virchau13/tree-sitter-astro`, which parses a fence followed by an
# **HTML/JSX** body. An `.amx` body is neither — it is MX (a strict Marko
# subset, decision 72), so that grammar would mis-parse the entire template,
# which is the larger half of the file. Marko's grammar parses the template
# correctly and mis-parses only the fence.
#
# Known limitation, and the reason this is a trade rather than a win: Marko's
# grammar has no notion of a `---` frontmatter fence, so the fence highlights
# as Marko markup instead of TypeScript. Fixing that needs a grammar that
# composes the two — an `.amx`-specific scanner in the shape of
# `packages/editors/tree-sitter-solidmx`'s (whose split, fence versus body, is even
# simpler than SolidMX's expression-position problem). That is follow-up work,
# not done here; no new grammar is added, so `zed-compile-check` has nothing
# new to cover.
#
# JS-style line comments in expression positions; HTML comments in markup —
# the same convention as `MX`, since the template half is the same language.
line_comments = ["// "]
block_comment = ["<!-- ", " -->"]

tab_size = 2
hard_tabs = false

autoclose_before = ";:.,=}])>` \t\n"

brackets = [
  { start = "<", end = ">", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
