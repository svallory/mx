# https://moonrepo.dev/docs/config/project
$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

tasks:
  typecheck:
    command: "echo"
    args: "typecheck passed"
    deps:
      - "^:typecheck"

  test:
    command: "echo"
    args: "test passed"
    deps:
      - "^:test"

  lint:
    command: "bun"
    args: ["run", "lint"]
    inputs:
      - "packages/*/src/**/*"
      - "biome.json"

  verify:
    command: "echo"
    args: "verify passed"
    deps:
      - "typecheck"
      - "lint"
      - "test"
    options:
      runDepsInParallel: false
